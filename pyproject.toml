[project]
name = "procedural-istanbul-analysis"
version = "0.1.0"
description = "Python side of procedural-istanbul: İBB data archive and OD estimation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyarrow>=15",
  "h3>=4",
  "tzdata; sys_platform == 'win32'",  # zoneinfo has no time zone database on Windows
]

[dependency-groups]
# SUMO network build and simulation (tools/sumo); uv run --group sumo ...
sumo = [
  "eclipse-sumo==1.27.1",
  "sumolib==1.27.1",
  "sumo-data==1.27.1",
  "rtree>=1.2",       # spatial index sumolib uses for edge lookups
  "pyproj>=3.6",      # lon/lat <-> network coordinates
]

# neural sim-to-real inverse solver (tools/od/neural_inverse.py); uv run --group sumo --group ml ...
ml = ["scikit-learn>=1.4"]

[tool.uv]
package = false
