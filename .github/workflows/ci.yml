name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test            # 3D data pipeline (compiled-tile checks skip without data)
      - run: npm run build       # the browser client bundles
      - uses: astral-sh/setup-uv@v5
      - run: uv run python tools/od/test_odme.py   # inverse OD on a synthetic city
