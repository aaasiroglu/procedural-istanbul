<h2 id="problem">Problem</h2>
<ul>
<li><strong>Simülatör yolculuk ister, sensör hız verir.</strong> SUMO gibi bir simülatör başlangıç–varış (O-D) matrisine, yani kimin nereden nereye gittiğine ihtiyaç duyar. İBB'nin canlı akışı ise her yol kesimi için yalnızca <strong>hız</strong> ve <strong>sıkışıklık sınıfı</strong> verir.</li>
<li><strong>Sayım az, problem kötü konumlanmış.</strong> 9.025 O-D çifti, eldeki gözlemlerin yüzlerce katı. Veri tek başına matrisi belirleyemez.</li>
<li><strong>Yaygın yaklaşımın zaafı.</strong> Hızı sahte sayıma çevirmek, verinin taşımadığı bir kesinliği modele sokar. Tahminin ne kadarının veriden, ne kadarının varsayımdan geldiği çoğu çalışmada raporlanmaz.</li>
</ul>
<div class="note">
<p><strong>Amaç:</strong> Koridorun saatlik O-D matrisini açık veriden tahmin etmek, belirsizliği açıkça raporlamak ve sonucu modelin görmediği sayımlarla doğrulamak.</p>
</div>

<h2 id="katk%C4%B1-1-h%C4%B1z-sans%C3%BCrl%C3%BC-bir-g%C3%B6zlemdir">Katkı 1: Hız, sansürlü bir gözlemdir</h2>
<div class="cols">
<div>
<p><img src="img/temel-diyagram.png" alt="" style="width:560px;" /></p>
</div>
<div>
<ul>
<li><strong>Serbest akış hızı akımı belirlemez:</strong> akım 0 ile kapasite arasında herhangi bir değer olabilir. Hız yalnızca <strong>üst sınır</strong> verir.</li>
<li><strong>Sıkışık dalda</strong> q = w·k<sub>j</sub>·v / (v + w). Kuyruk varsa talep geçen akımdan büyüktür; hız bu durumda <strong>alt sınır</strong> verir.</li>
<li>Sıkışık ya da serbest kararını İBB'nin segment bazındaki <strong>sıkışıklık sınıfı</strong> verir.</li>
</ul>
</div>
</div>

<h2 id="katk%C4%B1-2-belirsizlik-ve-d%C3%BCr%C3%BCst-do%C4%9Frulama">Katkı 2: Belirsizlik ve dürüst doğrulama</h2>
<ul>
<li><strong>Veri payı.</strong> Her O-D çifti için tahminin veriden gelen kısmı: 1 − σ²<sub>sonsal</sub> / σ²<sub>prior</sub>. Laplace yaklaşımı; Woodbury özdeşliğiyle n × n yerine m × m çözüm.</li>
<li><strong>İlişkili prior hataları.</strong> x<sub>ij</sub> = x<sub>0,ij</sub> · e<sup>g + a<sub>i</sub> + b<sub>j</sub> + u<sub>ij</sub></sup>. Zon çarpanları (a<sub>i</sub>, b<sub>j</sub>) bir zonun tüm trafiğini tek sayıyla düzeltir; <strong>g</strong> tüm matrisin düzeyini taşır.</li>
<li><strong>Dışarıda bırakılan doğrulama.</strong> GEH, modelin uydurulduğu sayımlarda değil, her sayım tek tek dışarıda bırakıldığında ölçülür.</li>
<li><strong>Bilevel tahmin.</strong> UE ataması ile tahmin dönüşümlü çalışır; salınım ardışık ortalamalarla (MSA) sönümlenir (Spiess 1990; Yang ve ark. 1992).</li>
<li><strong>Sayısal koşullanma.</strong> Optimizasyon log-uzayda (z = x<sub>0</sub>·e<sup>u</sup>); prior değerleri 12 mertebeye yayılsa da L-BFGS yakınsar.</li>
</ul>

<h2 id="katk%C4%B1-3-talep-d%C3%BCzeyi-ne-zaman-sabitlenmi%C5%9F-say%C4%B1l%C4%B1r">Katkı 3: Talep düzeyi ne zaman sabitlenmiş sayılır?</h2>
<p><img src="img/talep-duzeyi.png" alt="" style="width:860px;" /></p>
<ul>
<li>Düzeyin veri payı, profil amaç fonksiyonunun eğriliğinden hesaplanır: σ²<sub>g</sub> = 2 / f″(g), pay = 1 − σ²<sub>g</sub> / σ²<sub>prior</sub>.</li>
<li><strong>Bulgu:</strong> Zon çarpanları serbestken tek bir kesit sayımı düzeyin ancak <strong>yarısını</strong> belirliyor, çünkü sayım kestiği zonları büyüterek de karşılanabiliyor. Düzeyi sabitlemek için <strong>bağımsız zonları kesen birden çok sayım</strong> gerekir.</li>
</ul>

<h2 id="sentetik-do%C4%9Frulama-ger%C3%A7ek-o-dsi-bilinen-%C5%9Fehir">Sentetik doğrulama: gerçek O-D'si bilinen şehir</h2>
<p><img src="img/sentetik.png" alt="" style="width:920px;" /></p>
<ul>
<li>Sayılmayan linklerde ortalama GEH, prior'a göre <strong>5,6'dan 2,2'ye</strong> (rotalar biliniyorken) ve <strong>3,8'e</strong> (rotalar da tahmin edilirken) iniyor. Rotaları prior'a sabitlemek 8,0 veriyor; bilevel tahmin gerekli.</li>
<li>Gerçek değerlerin <strong>%96'sı 2,5 standart hata içinde</strong>: belirsizlik aşırı iyimser değil.</li>
<li><strong>Akımlar belirlenebiliyor, tek tek O-D hücreleri belirlenemiyor</strong> (36 sayım, 90 çift). Bunu açıkça raporlamak katkının parçası.</li>
</ul>

<p><img src="img/dislanan-sayimlar.png" alt="" style="width:480px;" /><br />
<span class="small">Pazartesi 11:00 koşusu: her sayım tek tek dışarıda bırakıldığında.</span></p>

<div>
<ol>
<li><strong>Sayım tanımları çelişiyor.</strong> Üç O-2 sensörü modelde aynı akıma oturuyor; sayımları ise 4.291 / 7.108 / 8.171 araç/sa. Aralarında rampa yoksa bu mümkün değil: yön ya da şerit kapsamı farklı olmalı.</li>
<li><strong>Geçitler ve ağ.</strong> FSM'de model, sayımın ancak yarısını taşıyabiliyor; geçit prior'ı kapasiteye dayalı kaba bir varsayım.</li>
<li><strong>Prior.</strong> Link parametreleri (İBB 2020 kapasite ve BPR) darboğaz değil; 2012 anketinin yolculuk tipi payları küçük bir iyileşme getirdi.</li>

<h2 id="ger%C3%A7ek-koridorda-talep-d%C3%BCzeyi-say%C4%B1mlar-d%C3%BCzeyi-sabitliyor">Gerçek koridorda talep düzeyi: sayımlar düzeyi sabitliyor</h2>
<p><img src="img/talep-duzeyi-koridor.png" alt="" style="width:980px;" /></p>
<ul>
<li>Pazartesi 11:30 canlı İBB hızları ve Ekim 2024 Pazartesi 11:00–12:00 sayımları (23 sensör).</li>
<li>Düzeyin veri payı <strong>0,81</strong>: düzey ilk kez <strong>sayımlarla sabitlendi</strong> (eşik 0,8).</li>
<li>Düzey çarpanı <strong>0,30</strong> (%95: 0,19–0,46); zon çarpanlarıyla birlikte toplam talep 117,9 binden <strong>61,6 bine</strong> iniyor: arazi kullanımından kurulan prior talebi <strong>neredeyse iki kat</strong> yüksek gösteriyordu. SUMO'daki kilitlenmenin kaynağı bu.</li>
<li>Dışarıda bırakılan GEH &lt; 5 oranı %8,7 (ortalama 22,9): <strong>düzey doğru, dağılım hâlâ zayıf.</strong></li>
</ul>

<h2 id="i%CC%87ki-yeni-mod%C3%BCl-%C3%A7ok-kaynakl%C4%B1-%C3%A7apalar-ve-sinir-a%C4%9F%C4%B1-denet%C3%A7isi">İki yeni modül: çok kaynaklı çapalar ve sinir ağı denetçisi</h2>
<div class="cols">
<div>
<h3 id="%C3%A7ok-kaynakl%C4%B1-%C3%A7apalar">Çok kaynaklı çapalar</h3>
<ul>
<li>Çapa, bir linki değil <strong>doğrudan bir O-D toplamını</strong> kısıtlar: köprünün bir yönü, bir zon grubunun ürettiği yolculuklar.</li>
<li><strong>İstanbulkart:</strong> koridordaki 31 raylı sistem ve metrobüs durağında 11:00–12:00'de 11.764 biniş.</li>
<li>Sayımlar koridor zonlarının üretimini 57,4 binden <strong>15,6 bine</strong> indirmişti; bağımsız İstanbulkart çapası (11,8 ± 11,9 bin) <strong>bununla tutarlı</strong>.</li>
</ul>
</div>
<div>
<h3 id="sim%C3%BClasyondan-ger%C3%A7e%C4%9Fe-sinir-a%C4%9F%C4%B1">Simülasyondan gerçeğe sinir ağı</h3>
<ul>
<li>300 simüle örnek (O-D → 712 linkte hız) ile eğitilen MLP; MAP tahmincisi <strong>denetçi</strong>.</li>
<li>Toplam talep için R² 0,15. Canlı veride MAP'in <strong>4,8 katını</strong> verdi.</li>
<li>Neden: statik model gerçek yavaşlamayı üretmiyor (hız oranı medyanı gerçekte 0,32, modelde 0,99).</li>
<li><strong>Denetçi bunu yakaladı</strong> (<code>trustworthy: false</code>). Sırada SUMO'dan üretilen örnekler var.</li>
</ul>
</div>
</div>

<h2 id="sonraki-ad%C4%B1mlar">Sonraki adımlar</h2>
<ol>
<li><strong>Sensör tanımları:</strong> yön, şerit kapsamı ve gişe/rampa ayrımının İBB'den teyidi (çelişen O-2 sensörleri).</li>
<li><strong>Talep düzeyi:</strong> köprünün iki yönü ayrı ve O-1, O-2 kesitleriyle birden çok bağımsız sayım; düzeyin veri payı ≥ 0,8.</li>
<li><strong>Zaman:</strong> saatlik yoğunluk arşivinden gün tipi ve saat profilleri; canlı hız arşivinin sürekli çalışması.</li>
<li><strong>Dinamik tutarlılık:</strong> sayımlı talebin SUMO'da ölçekli koşularla sınanması (%25 / %50 / %75 / %100).</li>
<li><strong>Öneri motoru:</strong> sürücüye kalkış saati, mod ve köprü seçimi; kuruma darboğaz sıralaması ve senaryo karşılaştırması.</li>
</ol>
<p><strong>Hedef yayın yolu:</strong> TRB Annual Meeting / hEART (yöntem ve vaka), ardından <em>Transportation Research Part C</em> (çok haftalık doğrulama) ve açık veri seti makalesi.</p>
